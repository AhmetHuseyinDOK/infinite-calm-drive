<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a1a33">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Infinite Calm Drive</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none;
    -webkit-user-select: none; user-select: none; font-family: ui-rounded, "SF Pro Rounded", "Hiragino Maru Gothic ProN", system-ui, sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; }
  #vig { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse 75% 70% at 50% 55%, rgba(10,10,40,0) 55%, rgba(10,10,40,.38) 100%); }
  #hud { position: fixed; top: max(14px, env(safe-area-inset-top)); left: 16px; color: #fff; opacity: .78;
    font-size: 14px; letter-spacing: .04em; text-shadow: 0 1px 4px rgba(0,0,0,.45); pointer-events: none; }
  #hud b { font-size: 22px; font-weight: 600; }
  #btns { position: fixed; top: max(12px, env(safe-area-inset-top)); right: 12px; display: flex; gap: 8px; }
  #btns button { background: rgba(255,255,255,.16); color: #fff; border: 0; border-radius: 999px; width: 40px; height: 40px;
    font-size: 17px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); cursor: pointer; }
  #start { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #fff; text-align: center; background: radial-gradient(ellipse at center, rgba(20,20,60,.1), rgba(10,10,40,.5));
    cursor: pointer; transition: opacity 1.4s; text-shadow: 0 2px 12px rgba(0,0,0,.35); }
  #start .jp { font-size: clamp(16px, 3.4vw, 22px); letter-spacing: .6em; opacity: .85; margin-bottom: 10px; }
  #start h1 { font-weight: 300; font-size: clamp(30px, 7vw, 64px); letter-spacing: .12em; margin: 0 0 14px; }
  #start p { opacity: .85; margin: 4px 16px; font-size: 15px; line-height: 1.5; }
  #start .go { margin-top: 26px; padding: 12px 30px; border: 1px solid rgba(255,255,255,.7); border-radius: 999px;
    letter-spacing: .2em; font-size: 14px; animation: breathe 3.5s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity: .45; } }
  #hint { position: fixed; bottom: max(18px, env(safe-area-inset-bottom)); width: 100%; text-align: center; color: #fff;
    opacity: 0; font-size: 13px; transition: opacity 2s; pointer-events: none; text-shadow: 0 1px 4px rgba(0,0,0,.6); }
  #zone { position: fixed; top: 22%; width: 100%; text-align: center; color: #fff; pointer-events: none; opacity: 0;
    transition: opacity 2.2s ease, transform 4s ease; text-shadow: 0 2px 16px rgba(0,0,0,.35); transform: translateY(8px); }
  #zone.on { opacity: 1; transform: translateY(0); }
  #zone .jp { font-size: clamp(30px, 6.5vw, 58px); letter-spacing: .3em; font-weight: 300; }
  #zone .en { font-size: clamp(12px, 2.2vw, 16px); letter-spacing: .45em; text-transform: uppercase; opacity: .85; margin-top: 8px; }
  #zone .line { width: 60px; height: 1px; background: rgba(255,255,255,.7); margin: 12px auto 0; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vig"></div>
<div id="hud"><b id="spd">0</b> km/h &nbsp;·&nbsp; <span id="dist">0.0</span> km<br><span id="clock"></span></div>
<div id="btns"><button id="snd" title="Sound (M)">♪</button><button id="tim" title="Pause time of day (T)">☼</button></div>
<div id="zone"><div class="jp"></div><div class="en"></div><div class="line"></div></div>
<div id="start">
  <div class="jp">どこまでも</div>
  <h1>infinite calm drive</h1>
  <p>Country roads, cherry blossoms, the sea, city lights — and back again.</p>
  <p>No destination. No traffic. No way to lose. The car drives itself.</p>
  <div class="go">TAP TO BEGIN</div>
</div>
<div id="hint">← → or touch sides to steer · ↑ ↓ or drag up/down for speed · let go and it drives itself</div>
<script>
(() => {
'use strict';
const cv = document.getElementById('c'), mainCtx = cv.getContext('2d');
let ctx = mainCtx;
let W = 0, H = 0, U = 0, HZ = 0, DPR = 1, vignette = null;
const QS = new URLSearchParams(location.search);

// ---------- helpers ----------
const SEED = Math.floor(Math.random() * 1e6);
function hash(n) { n = (n ^ SEED) | 0; n = Math.imul(n ^ (n >>> 15), 0x2c1b3c6d); n = Math.imul(n ^ (n >>> 12), 0x297a2d39); n ^= n >>> 15; return (n >>> 0) / 4294967296; }
function noise(x, k) { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return hash(i * 131 + k) * (1 - u) + hash((i + 1) * 131 + k) * u; }
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => t * t * (3 - 2 * t);
const mixc = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const rgb = c => `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})`;
const rgba = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
function poly(c, pts) { ctx.fillStyle = c; ctx.beginPath(); ctx.moveTo(pts[0], pts[1]); for (let j = 2; j < pts.length; j += 2) ctx.lineTo(pts[j], pts[j + 1]); ctx.fill(); }
function circ(c, x, y, r) { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, Math.max(0.1, r), 0, 7); ctx.fill(); }
function blob(c, xs) { ctx.fillStyle = c; ctx.beginPath(); for (let j = 0; j < xs.length; j += 3) { const r = Math.max(0.1, xs[j + 2]); ctx.moveTo(xs[j] + r, xs[j + 1]); ctx.arc(xs[j], xs[j + 1], r, 0, 6.2832); } ctx.fill(); }
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function makeGlow(c) {
  const g = document.createElement('canvas'); g.width = g.height = 64; const x = g.getContext('2d');
  const gr = x.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, rgba(c, 1)); gr.addColorStop(0.25, rgba(c, 0.45)); gr.addColorStop(1, rgba(c, 0));
  x.fillStyle = gr; x.fillRect(0, 0, 64, 64); return g;
}
const GLOW = { warm: makeGlow([255, 200, 120]), red: makeGlow([255, 50, 50]), pink: makeGlow([255, 90, 170]), cyan: makeGlow([80, 220, 255]),
  white: makeGlow([255, 250, 235]), fly: makeGlow([200, 255, 120]) };
function glow(g, x, y, r, a) { if (a <= 0.01 || r < 0.5) return; ctx.globalAlpha = Math.min(1, a); ctx.drawImage(g, x - r, y - r, r * 2, r * 2); ctx.globalAlpha = 1; }

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 1.5);
  W = Math.floor(innerWidth * DPR); H = Math.floor(innerHeight * DPR);
  cv.width = W; cv.height = H;
  U = Math.min(W, H) / 2;
  HZ = H * (W > H ? 0.5 : 0.44);
}

// ---------- environments ----------
const ENVS = [
  { key: 'country', jp: '田舎道', en: 'Country Road', hills: 1.0, curv: 1.0,
    ground: [[112, 184, 78], [100, 172, 70]] },
  { key: 'sakura', jp: '桜並木', en: 'Cherry Blossom Avenue', hills: 0.7, curv: 0.8,
    ground: [[150, 196, 112], [162, 200, 124]] },
  { key: 'sea', jp: '海沿いの道', en: 'Coastal Road', hills: 0.35, curv: 1.0,
    ground: [[132, 186, 96], [122, 178, 88]] },
  { key: 'city', jp: '街の灯', en: 'City Lights', hills: 0.12, curv: 0.45,
    ground: [[168, 168, 172], [158, 158, 164]] },
];
const ZONE = 2400, TRANS = 360;
const ENV_START = Math.max(0, ENVS.findIndex(e => e.key === QS.get('env')));
function envMix(i) {
  const z = Math.floor(i / ZONE), l = i - z * ZONE;
  return { a: ENVS[((z % 4) + 4) % 4], b: ENVS[(((z + 1) % 4) + 4) % 4], t: smooth(clamp((l - (ZONE - TRANS)) / TRANS, 0, 1)) };
}
function envW(i, key) { const m = envMix(i); return (m.a.key === key ? 1 - m.t : 0) + (m.b.key === key ? m.t : 0); }
const envAt = i => { const m = envMix(i); return m.t < 0.5 ? m.a : m.b; };

// ---------- road shape ----------
const SEG = 200, ROADW = 2000, CAMH = 1000, DRAW = 210, FOV = 100, DEPTH = 1 / Math.tan(FOV / 2 * Math.PI / 180);
const MAXSPEED = SEG * 60;
const cache = { c: new Map(), h: new Map(), s: new Map() };
function cached(map, i, fn) { let v = map.get(i); if (v === undefined) { v = fn(i); map.set(i, v); if (map.size > 5000) map.clear(); } return v; }
const curve = i => cached(cache.c, i, i => {
  const v = (noise(i / 170, 11) - 0.5) * 2 + (noise(i / 60, 23) - 0.5) * 0.5;
  const a = Math.abs(v), m = envMix(i);
  return (a < 0.18 ? 0 : Math.sign(v) * (a - 0.18) / 0.82 * 5) * lerp(m.a.curv, m.b.curv, m.t);
});
const hill = i => cached(cache.h, i, i => {
  const m = envMix(i);
  return ((noise(i / 110, 37) - 0.5) * 5200 + (noise(i / 35, 41) - 0.5) * 900) * lerp(m.a.hills, m.b.hills, m.t);
});

// ---------- scenery placement ----------
const BLDG = [[238, 228, 210], [212, 222, 234], [230, 208, 192], [204, 216, 204], [242, 238, 230], [192, 204, 222], [226, 218, 236]];
const sprites = i => cached(cache.s, i, i => {
  const m = envMix(i), e = hash(i * 41 + 5) < m.t ? m.b : m.a, out = [];
  const R = k => hash(i * 97 + k * 13 + 7), side = k => R(k) < 0.5 ? -1 : 1;
  switch (e.key) {
    case 'country':
      if (i % 10 === 0) out.push({ t: 'pole', x: 1.32 });
      if (i % 61 === 0) out.push({ t: 'busstop', x: -1.32 });
      else if (i % 47 === 0) out.push({ t: 'vending', x: -1.28 });
      if (R(1) < 0.045) out.push({ t: 'house', x: side(2) * (2.6 + R(3) * 4.5), w: 1900 + R(4) * 1200, h: 1300 + R(5) * 500, seed: i });
      if (R(6) < 0.2) out.push({ t: R(7) < 0.75 ? 'round' : 'pine', x: side(8) * (2 + R(9) * 6), s: 0.7 + R(10) * 0.7 });
      if (R(11) < 0.06) out.push({ t: 'flowers', x: side(12) * (1.3 + R(13) * 1.5) });
      if (R(14) < 0.03) out.push({ t: 'hay', x: side(15) * (2 + R(16) * 4) });
      break;
    case 'sakura':
      for (const s of [-1, 1]) if (R(s + 3) < 0.55) out.push({ t: 'sakura', x: s * (1.4 + R(s + 5) * 1.2), s: 0.8 + R(s + 7) * 0.5 });
      if (R(20) < 0.25) out.push({ t: 'sakura', x: side(21) * (3 + R(22) * 4), s: 0.8 + R(23) * 0.6 });
      if (i % 16 === 0) { out.push({ t: 'lantern', x: -1.22 }); out.push({ t: 'lantern', x: 1.22 }); }
      if (i % 420 === 210) out.push({ t: 'torii', x: 0 });
      if (R(24) < 0.03) out.push({ t: 'house', x: side(25) * (3.5 + R(26) * 3), w: 1900 + R(27) * 1000, h: 1300 + R(28) * 500, seed: i });
      break;
    case 'sea':
      if (i % 10 === 0) out.push({ t: 'pole', x: 1.32 });
      if (i % 24 === 12) out.push({ t: 'lamp', x: 1.2 });
      if (R(1) < 0.28) out.push({ t: 'pine', x: 1.6 + R(2) * 3.5, s: 0.7 + R(3) * 0.6 });
      if (R(4) < 0.03) out.push({ t: 'house', x: 2.8 + R(5) * 3, w: 1800 + R(6) * 900, h: 1300 + R(7) * 400, seed: i });
      if (R(8) < 0.035) out.push({ t: 'rock', x: -(2.6 + R(9) * 7), s: 0.6 + R(10) * 1.2 });
      if (i % 900 === 450) out.push({ t: 'lighthouse', x: -7 });
      break;
    case 'city':
      for (const s of [-1, 1]) if ((i + (s > 0 ? 0 : 1)) % 3 === 0) {
        const w = 1500 + R(s + 30) * 2200, h = 2400 + Math.pow(R(s + 31), 1.6) * 10000;
        out.push({ t: 'bldg', x: s * (1.45 + w / (2 * ROADW)), w, h, seed: i * 2 + (s > 0 ? 1 : 0),
          col: BLDG[Math.floor(R(s + 32) * BLDG.length)], cols: clamp(Math.round(w / 480), 2, 7), rows: clamp(Math.round((h - 700) / 650), 1, 14),
          neon: R(s + 33) < 0.35 ? (R(s + 34) < 0.5 ? 'pink' : 'cyan') : null, awn: Math.floor(R(s + 35) * 4), tank: R(s + 36) < 0.3 });
      }
      if (i % 12 === 6) { out.push({ t: 'lamp', x: -1.14 }); out.push({ t: 'lamp', x: 1.14 }); }
      if (i % 10 === 0) out.push({ t: 'pole', x: 1.3 });
      if (i % 9 === 3) out.push({ t: 'round', x: side(40) * 1.22, s: 0.45 });
      if (i % 43 === 20) out.push({ t: 'vending', x: side(41) * 1.24 });
      break;
  }
  return out;
});

// ---------- time of day ----------
const KEYS = [ // t, top, horizon, fog, light
  [0.00, [10, 14, 44],  [36, 44, 92],    [28, 34, 70],   0.22],
  [0.20, [34, 38, 96],  [150, 104, 150], [104, 84, 126], 0.42],
  [0.27, [80, 130, 214],[255, 188, 150], [222, 176, 160],0.78],
  [0.35, [52, 132, 236],[176, 222, 252], [184, 216, 240],1.00],
  [0.62, [52, 132, 236],[176, 222, 252], [184, 216, 240],1.00],
  [0.70, [74, 116, 210],[255, 206, 150], [236, 196, 160],0.88],
  [0.77, [80, 70, 160], [255, 140, 120], [210, 130, 136],0.62],
  [0.85, [28, 30, 86],  [110, 72, 140],  [70, 56, 110],  0.34],
  [1.00, [10, 14, 44],  [36, 44, 92],    [28, 34, 70],   0.22],
];
const sky = { top: [0, 0, 0], bot: [0, 0, 0], fog: [0, 0, 0], light: 1, night: 0, warm: 0 };
function updateSky(t) {
  let k = 0; while (k < KEYS.length - 2 && KEYS[k + 1][0] <= t) k++;
  const a = KEYS[k], b = KEYS[k + 1], s = smooth(clamp((t - a[0]) / (b[0] - a[0]), 0, 1));
  sky.top = mixc(a[1], b[1], s); sky.bot = mixc(a[2], b[2], s); sky.fog = mixc(a[3], b[3], s); sky.light = lerp(a[4], b[4], s);
  sky.night = clamp((0.7 - sky.light) * 2.2, 0, 1);
  const el = Math.sin((t - 0.25) * Math.PI * 2); sky.warm = clamp(1 - Math.abs(el) * 3, 0, 1) * (el > -0.2 ? 1 : 0);
}
const NIGHT = [18, 24, 62];
function lit(c) { const L = sky.light, k = (1 - L) * 0.55; return [c[0] * L + NIGHT[0] * k, c[1] * L + NIGHT[1] * k, c[2] * L + NIGHT[2] * k]; }
function shadeRaw(c, fog) { const l = lit(c); return rgb(mixc(l, sky.fog, fog)); }
let frameNo = 0;
function shade(c, fog) { // per-frame cache keyed on the colour array + quantised fog
  if (c._f !== frameNo) { c._f = frameNo; c._s = []; }
  const q = (fog * 40) | 0; return c._s[q] || (c._s[q] = shadeRaw(c, q / 40));
}
function sh(c, f, d) {
  if (d === 1) return shade(c, f);
  if (c._f !== frameNo) { c._f = frameNo; c._s = []; }
  const q = 100 + ((f * 40) | 0) + (d * 1000 | 0) * 64; return c._s[q] || (c._s[q] = shadeRaw([c[0] * d, c[1] * d, c[2] * d], ((f * 40) | 0) / 40));
}

const K100_100_108 = [100, 100, 108], K102_74_56 = [102, 74, 56], K110_110_110 = [110, 110, 110], K110_112_120 = [110, 112, 120], K110_170_110 = [110, 170, 110], K120_118_116 = [120, 118, 116], K120_120_125 = [120, 120, 125], K120_150_180 = [120, 150, 180], K120_90_70 = [120, 90, 70], K130_100_76 = [130, 100, 76], K140_136_128 = [140, 136, 128], K150_110_80 = [150, 110, 80], K150_112_80 = [150, 112, 80], K150_140_120 = [150, 140, 120], K150_140_130 = [150, 140, 130], K150_150_156 = [150, 150, 156], K150_180_200 = [150, 180, 200], K160_162_170 = [160, 162, 170], K170_166_156 = [170, 166, 156], K200_170_100 = [200, 170, 100], K200_220_235 = [200, 220, 235], K210_210_200 = [210, 210, 200], K214_70_66 = [214, 70, 66], K220_60_60 = [220, 60, 60], K226_200_130 = [226, 200, 130], K226_230_234 = [226, 230, 234], K226_74_52 = [226, 74, 52], K230_228_222 = [230, 228, 222], K230_232_236 = [230, 232, 236], K236_228_208 = [236, 228, 208], K240_248_255 = [240, 248, 255], K248_248_244 = [248, 248, 244], K250_250_245 = [250, 250, 245], K250_250_250 = [250, 250, 250], K250_252_255 = [250, 252, 255], K34_84_66 = [34, 84, 66], K40_42_54 = [40, 42, 54], K46_34_36 = [46, 34, 36], K50_130_190 = [50, 130, 190], K58_118_82 = [58, 118, 82], K60_60_70 = [60, 60, 70], K60_70_80 = [60, 70, 80], K66_78_108 = [66, 78, 108], K70_80_96 = [70, 80, 96], K74_104_140 = [74, 104, 140], K80_76_70 = [80, 76, 70], K80_90_110 = [80, 90, 110], K84_90_100 = [84, 90, 100], K88_58_56 = [88, 58, 56], K90_80_90 = [90, 80, 90], K90_88_86 = [90, 88, 86], K96_110_142 = [96, 110, 142], K96_70_52 = [96, 70, 52]; // hoisted colours so the per-frame shade cache hits

// ---------- background ----------
const stars = Array.from({ length: 240 }, () => [Math.random(), Math.random() * 0.8, Math.random() * 1.4 + 0.3, Math.random() * 6.28]);
const mountains = [0, 1, 2].map(L => {
  const pts = [], n = 256;
  for (let i = 0; i <= n; i++) { const w = i % n; pts.push(noise(w / (18 - L * 4), 70 + L) * 0.65 + noise(w / (6 - L), 80 + L) * 0.25 + noise(w / 2, 90 + L) * 0.1); }
  return { pts, h: [0.36, 0.22, 0.12][L], col: [[150, 168, 214], [110, 146, 178], [84, 140, 112]][L], par: [0.25, 0.5, 0.9][L], fog: [0.5, 0.35, 0.2][L] };
});
const skyline = [0, 1].map(L => {
  const b = []; let x = 0;
  while (x < 1) { const w = 0.008 + Math.random() * 0.02; b.push({ x, w, h: (0.04 + Math.pow(Math.random(), 2) * 0.22) * (L ? 0.7 : 1), seed: Math.random() * 1e5 | 0, ant: Math.random() < 0.15 }); x += w + Math.random() * 0.004; }
  return { b, par: [0.3, 0.6][L], col: [[156, 170, 206], [124, 140, 180]][L], fog: [0.55, 0.4][L] };
});
const clouds = Array.from({ length: 13 }, (_, j) => {
  const puffs = [], n = 5 + Math.floor(Math.random() * 5);
  for (let p = 0; p < n; p++) { const fx = n === 1 ? 0 : (p / (n - 1) - 0.5) * 2, r = (1 - fx * fx * 0.55) * (0.32 + Math.random() * 0.2); puffs.push([fx * 0.95, -r * 0.55, r]); }
  for (let p = 0; p < 3; p++) { const fx = (Math.random() - 0.5) * 0.9; puffs.push([fx, -0.45 - Math.random() * 0.25, 0.25 + Math.random() * 0.15]); }
  const y = Math.random();
  return { x: j / 13 + Math.random() * 0.05, y: 0.08 + y * 0.48, s: (0.55 + Math.random() * 0.8) * (1.2 - y * 0.6), puffs, drift: 0.4 + Math.random() * 0.6 };
});
const boats = [0, 1, 2].map(() => ({ x: Math.random(), y: Math.random(), s: 0.6 + Math.random() * 0.6 }));
let wBG = { country: 1, sakura: 0, sea: 0, city: 0 };

function sunPos(t) {
  const ang = (t - 0.25) * Math.PI * 2;
  return [[Math.sin(ang), Math.cos(ang), 'sun'], [-Math.sin(ang), -Math.cos(ang), 'moon']].map(([el, az, kind]) =>
    ({ el, kind, x: W * 0.5 + (az * 0.38 - (skyOff * 0.02) % 1) * W * 0.9, y: HZ - el * HZ * 0.85 }));
}

function drawSky(t) {
  const g = ctx.createLinearGradient(0, 0, 0, HZ + U * 0.1);
  g.addColorStop(0, rgb(sky.top)); g.addColorStop(0.55, rgb(mixc(sky.top, sky.bot, 0.45))); g.addColorStop(1, rgb(sky.bot));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, Math.min(H, HZ + U * 0.4));
  // horizon haze band
  const hg = ctx.createLinearGradient(0, HZ - U * 0.35, 0, HZ + U * 0.05);
  hg.addColorStop(0, rgba(mixc(sky.bot, [255, 255, 255], 0.3), 0)); hg.addColorStop(1, rgba(mixc(sky.bot, [255, 255, 255], 0.3), 0.45));
  ctx.fillStyle = hg; ctx.fillRect(0, HZ - U * 0.35, W, U * 0.4);
  // stars
  if (sky.night > 0) {
    ctx.fillStyle = '#fff';
    for (const s of stars) {

  if (audio) audio.update(sp, envW(pI, 'sea'));
}

// ---------- HUD & zone card ----------
const $spd = document.getElementById('spd'), $dist = document.getElementById('dist'), $clock = document.getElementById('clock');
const $zone = document.getElementById('zone');
let hudT = 0, curZone = null, zoneTimer = 0;
function hud() {
  $spd.textContent = Math.round(speed / MAXSPEED * 160);
  $dist.textContent = distance.toFixed(1);
  const mins = Math.floor(tod * 1440);
  $clock.textContent = `${String(Math.floor(mins / 60)).padStart(2, '0')}:${String(mins % 60).padStart(2, '0')}`;
}
function zoneCard(e) {
  if (!started || e === curZone) return;
  curZone = e;
  $zone.querySelector('.jp').textContent = e.jp; $zone.querySelector('.en').textContent = e.en;
  $zone.classList.add('on'); clearTimeout(zoneTimer); zoneTimer = setTimeout(() => $zone.classList.remove('on'), 5000);
}

// ---------- audio: slow ambient pad + soft bells + road hum + waves ----------
let audio = null;
function makeAudio() {
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null;
  const ac = new AC(), master = ac.createGain(); master.gain.value = 0; master.connect(ac.destination);
  master.gain.linearRampToValueAtTime(0.5, ac.currentTime + 4);
  const len = ac.sampleRate * 4, ir = ac.createBuffer(2, len, ac.sampleRate);
  for (let ch = 0; ch < 2; ch++) { const d = ir.getChannelData(ch); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3); }
  const verb = ac.createConvolver(); verb.buffer = ir;
  const wet = ac.createGain(); wet.gain.value = 0.55; verb.connect(wet); wet.connect(master);
  const padLP = ac.createBiquadFilter(); padLP.type = 'lowpass'; padLP.frequency.value = 900; padLP.Q.value = 0.3;
  const padBus = ac.createGain(); padBus.gain.value = 0.11; padLP.connect(padBus); padBus.connect(master); padBus.connect(verb);
  const nb = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate), nd = nb.getChannelData(0); let lastN = 0;
  for (let i = 0; i < nd.length; i++) { lastN = (lastN + 0.02 * (Math.random() * 2 - 1)) / 1.02; nd[i] = lastN * 3.5; }
  const ns = ac.createBufferSource(); ns.buffer = nb; ns.loop = true;
  const nLP = ac.createBiquadFilter(); nLP.type = 'lowpass'; nLP.frequency.value = 400;
  const nG = ac.createGain(); nG.gain.value = 0; ns.connect(nLP); nLP.connect(nG); nG.connect(master); ns.start();
  // waves: white noise through a lowpass, swelling slowly
  const wb = ac.createBuffer(1, ac.sampleRate * 3, ac.sampleRate), wd = wb.getChannelData(0);
  for (let i = 0; i < wd.length; i++) wd[i] = Math.random() * 2 - 1;
  const ws = ac.createBufferSource(); ws.buffer = wb; ws.loop = true;
  const wBP = ac.createBiquadFilter(); wBP.type = 'lowpass'; wBP.frequency.value = 700;
  const wG = ac.createGain(); wG.gain.value = 0; ws.connect(wBP); wBP.connect(wG); wG.connect(master); wG.connect(verb); ws.start();
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  const CHORDS = [[48, 55, 64, 71, 74], [45, 52, 60, 67, 71], [41, 48, 57, 64, 67], [43, 50, 59, 62, 69], [40, 47, 55, 62, 67], [41, 48, 55, 64, 69]];
  const SCALE = [72, 74, 76, 79, 81, 84, 86, 88];
  let ci = 0, nextChord = ac.currentTime + 0.2, nextBell = ac.currentTime + 3;
  function chord(t) {
    const notes = CHORDS[ci++ % CHORDS.length], dur = 11;
    for (const m of notes) for (const det of [-5, 5]) {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = det < 0 ? 'sine' : 'triangle'; o.frequency.value = mtof(m); o.detune.value = det;
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.18, t + 3.5); g.gain.setValueAtTime(0.18, t + dur - 4); g.gain.linearRampToValueAtTime(0, t + dur + 1);
      o.connect(g); g.connect(padLP); o.start(t); o.stop(t + dur + 1.2);
    }
  }
  function bell(t) {
    const m = SCALE[Math.floor(Math.random() * SCALE.length)], o = ac.createOscillator(), o2 = ac.createOscillator(), g = ac.createGain(), g2 = ac.createGain();
    o.type = o2.type = 'sine'; o.frequency.value = mtof(m); o2.frequency.value = mtof(m) * 2.01; g2.gain.value = 0.25; o2.connect(g2); g2.connect(g);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.05, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 4);
    o.connect(g); g.connect(verb); g.connect(master); o.start(t); o2.start(t); o.stop(t + 4.2); o2.stop(t + 4.2);
  }
  return {
    ac, muted: false,
    update(sp, sea) {
      const t = ac.currentTime;
      while (nextChord < t + 1) { chord(nextChord); nextChord += 8; }
      if (nextBell < t + 0.5) { bell(nextBell); nextBell += 1.5 + Math.random() * 4.5; }
      nG.gain.setTargetAtTime(0.035 + sp * 0.07, t, 0.5);
      nLP.frequency.setTargetAtTime(250 + sp * 500, t, 0.5);
      const swell = 0.5 + 0.5 * Math.sin(t * 0.55) * Math.sin(t * 0.21 + 1);
      wG.gain.setTargetAtTime(sea * (0.012 + swell * 0.05), t, 0.3);
      wBP.frequency.setTargetAtTime(400 + swell * 900, t, 0.3);
    },
    toggle() { this.muted = !this.muted; master.gain.setTargetAtTime(this.muted ? 0 : 0.5, ac.currentTime, 0.3); },
  };
}

// ---------- input ----------
const keys = {};
addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === 'm' || e.key === 'M') toggleSound();
  if (e.key === 't' || e.key === 'T') toggleTime();
  if (!started && (e.key === ' ' || e.key === 'Enter')) begin();
});
addEventListener('keyup', e => { keys[e.key] = false; });
let ptr = null;
cv.addEventListener('pointerdown', e => { ptr = { id: e.pointerId, x: e.clientX, y: e.clientY, sy: e.clientY, sc: cruise }; });
addEventListener('pointermove', e => { if (ptr && e.pointerId === ptr.id) { ptr.x = e.clientX; ptr.y = e.clientY; cruise = clamp(ptr.sc - (ptr.y - ptr.sy) / innerHeight * 1.2, 0.15, 1); } });
addEventListener('pointerup', () => { ptr = null; });
addEventListener('pointercancel', () => { ptr = null; });
function readInput(dt) {
  steerIn = 0;
  if (keys.ArrowLeft || keys.a || keys.A) steerIn = -1;
  if (keys.ArrowRight || keys.d || keys.D) steerIn = 1;
  if (keys.ArrowUp || keys.w || keys.W) cruise = clamp(cruise + dt * 0.3, 0.15, 1);
  if (keys.ArrowDown || keys.s || keys.S) cruise = clamp(cruise - dt * 0.3, 0.15, 1);
  if (ptr && Math.abs(ptr.y - ptr.sy) < 30) steerIn = ptr.x < innerWidth / 2 ? -1 : 1;
  if (steerIn) lastInput = now;
}
const $snd = document.getElementById('snd'), $tim = document.getElementById('tim');
function toggleSound() { if (audio) { audio.toggle(); $snd.style.opacity = audio.muted ? 0.4 : 1; } }
function toggleTime() { todPaused = !todPaused; $tim.style.opacity = todPaused ? 0.4 : 1; }
$snd.onclick = e => { e.stopPropagation(); toggleSound(); };
$tim.onclick = e => { e.stopPropagation(); toggleTime(); };

const $start = document.getElementById('start'), $hint = document.getElementById('hint');
function begin() {
  if (started) return; started = true;
  try { audio = makeAudio(); audio && audio.ac.resume(); } catch (e) { audio = null; }
  $start.style.opacity = 0; setTimeout(() => $start.remove(), 1500);
  $hint.style.opacity = 0.7; setTimeout(() => $hint.style.opacity = 0, 9000);
}
$start.addEventListener('click', begin);
document.addEventListener('visibilitychange', () => { if (!audio) return; document.hidden ? audio.ac.suspend() : audio.ac.resume(); });

function frame(ts) {
  now = ts; frameNo++; const dt = Math.min(0.05, (ts - last) / 1000 || 0); last = ts; lastDt = dt;
  if (started) { readInput(dt); update(dt); } else { position += 1500 * dt; speed = 1500; }
  updateSky(tod);
  render();
  if ((hudT += dt) > 0.2) { hudT = 0; hud(); }
  requestAnimationFrame(frame);
}
addEventListener('resize', resize);
resize(); updateSky(tod);
requestAnimationFrame(frame);
})();
</script>
